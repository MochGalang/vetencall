<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoIP User Management</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="logo">
                <i class="fa-solid fa-satellite-dish"></i>
                <h2>VetenCall</h2>
            </div>
            <nav>
                <ul>
                    <li class="active"><a href="#"><i class="fa-solid fa-users"></i> Users</a></li>
                    <li><a href="#"><i class="fa-solid fa-phone-volume"></i> Calls (CDR)</a></li>
                    <li><a href="#"><i class="fa-solid fa-robot"></i> IVR & TTS</a></li>
                    <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-nav">
                <h1>User Management</h1>
                <div class="user-profile">
                    <span>Admin</span>
                    <div class="avatar">A</div>
                </div>
            </header>

            <section class="dashboard-content">
                <div class="action-bar">
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search users...">
                    </div>
                    <button id="btnNewUser" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add New User</button>
                </div>

                <div class="table-container glass-panel">
                    <table id="usersTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Ext / Phone</th>
                                <th>SIP Context</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Data will be populated via JS -->
                            <tr><td colspan="5" style="text-align: center;">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for New User -->
    <div id="userModal" class="modal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>Add New User</h2>
                <span class="close-btn">&times;</span>
            </div>
            <form id="newUserForm">
                <div class="form-group">
                    <label for="username">Name / Username</label>
                    <input type="text" id="username" required placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Extension / Phone Number</label>
                    <input type="text" id="phoneNumber" required placeholder="e.g. 1003">
                </div>
                <div class="form-group">
                    <label for="password">SIP Password</label>
                    <input type="password" id="password" required placeholder="Secret Password">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary close-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
